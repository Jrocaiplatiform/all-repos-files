name: J-ROC Desktop OS CI

on:
  push:
    branches:
      - jbot/repair-desktop-os
  pull_request:
    branches:
      - main

jobs:
  test-desktop-os:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JrocAiDesktopOS
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile kernel and service modules
        run: |
          python -m py_compile run_jroc_os.py \
            layer-01-kernel/kernel_core.py \
            layer-02-failover-router/router_engine.py \
            layer-03-memory-vault/vault_manager.py \
            layer-04-execution-tools/execution_engine.py \
            layer-05-security-sandbox/security_service.py \
            layer-06-worker-swarms/swarm_orchestrator.py \
            layer-07-jbot-core/jbot_service.py \
            layer-08-division-workspaces/workspace_manager.py \
            layer-09-industrial-hud/hud_bridge.py \
            layer-10-revenue-sync/revenue_service.py \
            layer-11-self-evolution/evolution_service.py \
            layer-12-device-mesh/device_mesh_service.py
      - name: Compile legacy HUD, launch and utility modules
        run: |
          python -m py_compile launch_command_center.py \
            global-tools/tools_suite.py \
            layer-07-jbot-core/jroc_core_engine.py \
            layer-07-jbot-core/voice_hud.py \
            layer-09-industrial-hud/jroc_desktop_hud.py
      - name: Run tests
        run: python -m pytest
