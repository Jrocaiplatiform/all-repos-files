# J-ROC inference policy: local-only. No hosted AI providers or API keys.
model_list:
  - model_name: jroc-primary
    litellm_params:
      model: ollama/llama3.2
      api_base: http://127.0.0.1:11434

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0
  enable_pre_call_checks: true

general_settings:
  database_url: sqlite:///../layer-03-memory-vault/jroc_os_vault.db
